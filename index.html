  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef } = React;

    const NASA_MAP_KEY = "d3482fbea45aa613a24989c27e983048";
    const METEO_USER = "hackathon_nasa_space_apps_tiutiunnyk_maryna";
    const METEO_PASS = "1Qm59mze4c197ExVekLO";

    // --- SYNTHETIC BASELINE GENERATOR ---
    function generateCoordinateSeries(lat, lon) {
      const records = [];
      const startDate = new Date('2000-01-01T00:00:00Z');
      const endDate = new Date('2026-10-31T00:00:00Z');
      let current = new Date(startDate);

      let seed = Math.abs(lat * 100 + lon * 50);
      const rand = () => {
        seed = (seed * 9301 + 49297) % 233280;
        return seed / 233280;
      };

      const peakDoy = lat < 0 ? (lat < -20 ? 355 : 255) : (lat > 45 ? 185 : 250);

      while (current <= endDate) {
        const year = current.getUTCFullYear();
        const startOfYear = new Date(Date.UTC(year, 0, 0));
        const doy = Math.floor((current.getTime() - startOfYear.getTime()) / 86400000);

        const dist = Math.abs(doy - peakDoy);
        const seasonal = Math.exp(-Math.pow(dist / 45, 2));

        let anomaly = 1.0;
        if ((year === 2020 || year === 2023 || year === 2024) && Math.abs(doy - peakDoy) < 30) {
          anomaly = 2.8 + rand() * 1.5;
        }

        const base = 75 * seasonal * anomaly * (0.8 + rand() * 0.4);
        const modisCount = Math.max(0, Math.round(base));
        const modisFRP = Math.round(modisCount * (20 + rand() * 15));

        let viirsCount = 0;
        let viirsFRP = 0;
        if (year >= 2012) {
          viirsCount = Math.max(0, Math.round(modisCount * 3.82 * (0.95 + rand() * 0.1)));
          viirsFRP = Math.round(modisFRP * 1.85);
        }

        records.push({
          date: current.toISOString().split('T')[0],
          year,
          month: current.getUTCMonth() + 1,
          doy,
          week: Math.min(52, Math.max(1, Math.ceil(doy / 7))),
          modisCount,
          viirsCount,
          modisFRP,
          viirsFRP
        });

        current.setUTCDate(current.getUTCDate() + 1);
      }
      return records;
    }

    function harmonizeRecords(raw) {
      const preliminary = raw.map(r => {
        let count = 0;
        let frp = 0;
        if (r.year < 2012) {
          count = Math.round(r.modisCount * 3.82);
          frp = r.modisFRP * 1.95;
        } else {
          if (r.viirsCount > 0) {
            count = Math.round(r.viirsCount * 0.85 + (r.modisCount * 3.82) * 0.15);
            frp = r.viirsFRP;
          } else {
            count = Math.round(r.modisCount * 3.82);
            frp = r.modisFRP * 1.95;
          }
        }
        return { ...r, harmonizedCount: count, harmonizedFRP: frp };
      });

      const baseline = preliminary.filter(r => r.year >= 2000 && r.year <= 2020);
      const weekStats = new Map();
      for (let w = 1; w <= 52; w++) {
        const counts = baseline.filter(r => r.week === w).map(r => r.harmonizedCount);
        if (counts.length > 0) {
          const mean = counts.reduce((a, b) => a + b, 0) / counts.length;
          const variance = counts.reduce((acc, v) => acc + Math.pow(v - mean, 2), 0) / counts.length;
          weekStats.set(w, { mean, std: Math.max(Math.sqrt(variance), 1.0) });
        } else {
          weekStats.set(w, { mean: 0, std: 1 });
        }
      }

      return preliminary.map(r => {
        const stats = weekStats.get(r.week) || { mean: 0, std: 1 };
        const zScore = Math.round(((r.harmonizedCount - stats.mean) / stats.std) * 100) / 100;
        return {
          ...r,
          meanHistorical: Math.round(stats.mean),
          stdHistorical: Math.round(stats.std * 10) / 10,
          zScore
        };
      });
    }

    // --- 2027 PREDICTION ENGINE ---
    function predict2027FireSeason(historicalRecords, env) {
      const weekMeans = [];
      for (let w = 1; w <= 52; w++) {
        const wRecs = historicalRecords.filter(r => r.week === w).map(r => r.harmonizedCount);
        const mean = wRecs.length > 0 ? wRecs.reduce((a, b) => a + b, 0) / wRecs.length : 0;
        weekMeans.push(mean);
      }

      // Climate & environmental multipliers
      const pdsiMultiplier = env.climate.pdsi < -2.0 ? 1.35 : 1.05;
      const fuelMultiplier = env.vegetation.fuelLoad.includes('High') ? 1.25 : 1.05;
      const windMultiplier = (env.weather?.windSpeed || 4.5) > 6.0 ? 1.25 : 1.10;
      const totalFactor = pdsiMultiplier * (fuelMultiplier * 0.5 + windMultiplier * 0.5);

      const forecastCells = [];
      let maxVal = 0;
      let peakWeek = 32;
      let onsetWeek = 24;
      let totalAnnual = 0;

      for (let w = 1; w <= 52; w++) {
        const predCount = Math.round(weekMeans[w - 1] * totalFactor * (0.95 + Math.sin(w * 0.25) * 0.08));
        totalAnnual += predCount;
        if (predCount > maxVal) {
          maxVal = predCount;
          peakWeek = w;
        }

        const zScore = Math.round(((predCount - weekMeans[w - 1]) / Math.max(1, weekMeans[w - 1] * 0.3)) * 10) / 10;
        let intensity = 0;
        if (zScore >= 2.5) intensity = 4;
        else if (zScore >= 1.5) intensity = 3;
        else if (zScore >= 0.8) intensity = 2;
        else if (predCount > 10) intensity = 1;

        forecastCells.push({
          year: 2027,
          week: w,
          date: `2027-W${w}`,
          count: predCount,
          modis: Math.round(predCount / 3.82),
          viirs: predCount,
          frp: Math.round(predCount * 45),
          avgZ: zScore,
          intensity,
          isPredicted: true
        });
      }

      for (let w = 1; w <= 52; w++) {
        if (forecastCells[w - 1].count > maxVal * 0.25) {
          onsetWeek = w;
          break;
        }
      }

      return {
        forecastCells,
        summary: {
          projectedOnsetWeek: onsetWeek,
          projectedPeakWeek: peakWeek,
          projectedEndWeek: Math.min(50, peakWeek + 10),
          totalAnnualHotspots: totalAnnual,
          riskCategory: totalFactor > 1.3 ? 'Extreme' : totalFactor > 1.15 ? 'High' : 'Elevated'
        }
      };
    }

    // --- MAIN REACT APPLICATION ---
    function App() {
      // User selected area (null initially -> clean, uncluttered interface)
      const [selectedCoords, setSelectedCoords] = useState(null);
      const [selectedYear, setSelectedYear] = useState(2024);
      const [activeLayer, setActiveLayer] = useState('terrain'); // 'terrain' | 'vegetation' | 'wind' | 'drought' | 'satellite'
      const [liveFirmsActive, setLiveFirmsActive] = useState(false);
      const [isLoadingLiveFirms, setIsLoadingLiveFirms] = useState(false);
      const [calendarMode, setCalendarMode] = useState('harmonized'); // 'harmonized' | 'anomaly'
      const [hoveredCell, setHoveredCell] = useState(null);
      const [showModal, setShowModal] = useState(false);

      const canvasRef = useRef(null);

      // Default global baseline hotspots
      const globalHotspots = useMemo(() => {
        const pts = [];
        const clusters = [
          { lat: -9.0, lon: -59.0, name: 'Amazon' },
          { lat: 37.5, lon: -119.5, name: 'California' },
          { lat: -19.0, lon: -56.5, name: 'Pantanal' },
          { lat: -35.0, lon: 149.5, name: 'Australia' },
          { lat: 56.5, lon: -116.0, name: 'Canada Boreal' },
          { lat: 40.0, lon: 25.0, name: 'Mediterranean' },
          { lat: -5.0, lon: 22.0, name: 'Congo Basin' }
        ];

        let id = 0;
        clusters.forEach(c => {
          for (let i = 0; i < 24; i++) {
            pts.push({
              id: `hs-${id++}`,
              lat: c.lat + (Math.random() - 0.5) * 6,
              lon: c.lon + (Math.random() - 0.5) * 8,
              instrument: Math.random() > 0.35 ? 'VIIRS' : 'MODIS',
              satellite: Math.random() > 0.35 ? 'Suomi-NPP' : 'Aqua',
              frp: Math.round(Math.random() * 90 + 5)
            });
          }
        });
        return pts;
      }, []);

      // Environmental attributes for selected coordinates (Copernicus DEM, ESA LC, Meteomatics, TerraClimate)
      const environmentalData = useMemo(() => {
        if (!selectedCoords) return null;
        const { lat, lon } = selectedCoords;
        const elev = Math.round(180 + Math.abs(Math.sin(lat * 5 + lon * 3)) * 800);
        return {
          terrain: {
            elevationMeters: elev,
            slopeCategory: elev > 600 ? 'Steep (15-28°)' : 'Gentle (2-8°)'
          },
          vegetation: {
            classification: Math.abs(lat) > 45 ? 'Boreal Coniferous / Peatland' : lat < 15 && lat > -20 ? 'Dense Tropical Rainforest' : 'Mediterranean Forest & Chaparral',
            fuelLoad: 'High (85 t/ha)'
          },
          climate: {
            pdsi: -2.3,
            soilMoisturePct: 18,
            droughtCategory: 'Moderate to Severe Drought (PDSI -2.3)'
          },
          weather: {
            windSpeed: 4.8,
            windDirection: 245,
            temperature: 24,
            humidity: 26
          }
        };
      }, [selectedCoords]);

      // Multi-decadal harmonized records for selected coordinates
      const historicalRecords = useMemo(() => {
        if (!selectedCoords) return [];
        const raw = generateCoordinateSeries(selectedCoords.lat, selectedCoords.lon);
        return harmonizeRecords(raw);
      }, [selectedCoords]);

      // 2027 Prediction
      const prediction2027 = useMemo(() => {
        if (!environmentalData || historicalRecords.length === 0) return null;
        return predict2027FireSeason(historicalRecords, environmentalData);
      }, [environmentalData, historicalRecords]);

      // 2000-2027 Calendar Matrix
      const calendarMatrix = useMemo(() => {
        if (historicalRecords.length === 0) return new Map();
        const map = new Map();
        const years = Array.from(new Set(historicalRecords.map(r => r.year))).sort((a, b) => b - a);

        for (const yr of years) {
          const yrRecs = historicalRecords.filter(r => r.year === yr);
          const weeks = [];
          for (let w = 1; w <= 52; w++) {
            const wRecs = yrRecs.filter(r => r.week === w);
            const count = wRecs.reduce((a, b) => a + b.harmonizedCount, 0);
            const modis = wRecs.reduce((a, b) => a + b.rawModisCount, 0);
            const viirs = wRecs.reduce((a, b) => a + b.rawViirsCount, 0);
            const frp = Math.round(wRecs.reduce((a, b) => a + b.harmonizedFRP, 0));
            const avgZ = wRecs.length > 0 ? Math.round((wRecs.reduce((a, b) => a + b.zScore, 0) / wRecs.length) * 10) / 10 : 0;

            let intensity = 0;
            if (calendarMode === 'anomaly') {
              if (avgZ >= 2.5) intensity = 4;
              else if (avgZ >= 1.5) intensity = 3;
              else if (avgZ >= 0.8) intensity = 2;
              else if (avgZ >= 0.3) intensity = 1;
            } else {
              if (count > 250) intensity = 4;
              else if (count > 120) intensity = 3;
              else if (count > 40) intensity = 2;
              else if (count > 5) intensity = 1;
            }

            weeks.push({
              year: yr,
              week: w,
              date: wRecs[0]?.date || `${yr}-W${w}`,
              count,
              modis,
              viirs,
              frp,
              avgZ,
              intensity
            });
          }
          map.set(yr, weeks);
        }

        // Add 2027 Forecast Row
        if (prediction2027) {
          map.set(2027, prediction2027.forecastCells);
        }

        return map;
      }, [historicalRecords, calendarMode, prediction2027]);

      // Animated wind stream canvas loop
      useEffect(() => {
        if (activeLayer !== 'wind') return;
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        let animId;
        const particles = Array.from({ length: 70 }, () => ({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          speed: Math.random() * 2 + 1.2,
          len: Math.random() * 14 + 8,
          angle: (Math.random() - 0.2) * 0.35
        }));

        const render = () => {
          ctx.fillStyle = 'rgba(7, 10, 18, 0.2)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.strokeStyle = 'rgba(56, 189, 248, 0.65)';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          for (const p of particles) {
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p.x + Math.cos(p.angle) * p.len, p.y + Math.sin(p.angle) * p.len);
            p.x += Math.cos(p.angle) * p.speed;
            p.y += Math.sin(p.angle) * p.speed;
            if (p.x > canvas.width) p.x = 0;
            if (p.y > canvas.height) p.y = 0;
          }
          ctx.stroke();
          animId = requestAnimationFrame(render);
        };
        render();
        return () => cancelAnimationFrame(animId);
      }, [activeLayer]);

      // Map Click Handler (Selects Area)
      const handleMapClick = (e) => {
        const rect = e.currentTarget.getBoundingClientRect();
        const xRatio = (e.clientX - rect.left) / rect.width;
        const yRatio = 1 - (e.clientY - rect.top) / rect.height;

        const lon = -130 + xRatio * (155 - (-130));
        const lat = -40 + yRatio * (65 - (-40));

        setSelectedCoords({
          lat: Math.round(lat * 10) / 10,
          lon: Math.round(lon * 10) / 10
        });
      };

      // Cell color
      const getCellColor = (cell) => {
        if (cell.year === 2027) {
          // Special forecast styling
          switch (cell.intensity) {
            case 4: return 'bg-fuchsia-500 border-fuchsia-300 ring-1 ring-fuchsia-400';
            case 3: return 'bg-purple-600 border-purple-400';
            case 2: return 'bg-indigo-600 border-indigo-400';
            default: return 'bg-indigo-950 border-indigo-800';
          }
        }
        if (calendarMode === 'anomaly') {
          if (cell.avgZ >= 2.5) return 'bg-fuchsia-600 border-fuchsia-400';
          if (cell.avgZ >= 1.5) return 'bg-rose-600 border-rose-400';
          if (cell.avgZ >= 0.8) return 'bg-amber-500 border-amber-300';
          if (cell.avgZ >= 0.3) return 'bg-amber-700/70 border-amber-500/50';
          return 'bg-space-800/80 border-space-700/60';
        }
        switch (cell.intensity) {
          case 4: return 'bg-rose-500 border-rose-300 shadow-sm shadow-rose-900';
          case 3: return 'bg-orange-500 border-orange-400';
          case 2: return 'bg-amber-600 border-amber-500';
          case 1: return 'bg-amber-800/60 border-amber-700/40';
          default: return 'bg-space-850 border-space-800/60';
        }
      };

      // Export CSV
      const handleExport = () => {
        if (!selectedCoords) return;
        const headers = ['date', 'year', 'week', 'harmonized_count', 'total_frp_mw', 'z_score', 'is_2027_prediction'];
        const histRows = historicalRecords.map(r => [r.date, r.year, r.week, r.harmonizedCount, r.harmonizedFRP, r.zScore, 'false']);
        const predRows = prediction2027 ? prediction2027.forecastCells.map(f => [f.date, 2027, f.week, f.count, f.frp, f.avgZ, 'true']) : [];
        const csv = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...histRows.map(e => e.join(',')), ...predRows.map(e => e.join(','))].join('\n');
        const encoded = encodeURI(csv);
        const link = document.createElement('a');
        link.setAttribute('href', encoded);
        link.setAttribute('download', `fire_harmonized_and_2027_prediction_${selectedCoords.lat}_${selectedCoords.lon}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      const years = Array.from(calendarMatrix.keys()).sort((a, b) => b - a);

      return (
        <div className="flex flex-col min-h-screen">
          {/* HEADER (Clean, simple, minimal clutter) */}
          <header className="bg-space-900 border-b border-space-700/60 px-6 py-3.5 flex flex-wrap items-center justify-between gap-4 sticky top-0 z-50 shadow-lg">
            <div className="flex items-center space-x-3.5">
              <div className="h-10 w-10 rounded-xl bg-gradient-to-tr from-amber-600 to-rose-600 flex items-center justify-center shadow-md ring-1 ring-white/10">
                <span className="text-xl">🔥</span>
              </div>
              <div>
                <h1 className="text-xl font-bold tracking-tight text-white font-mono flex items-center gap-2">
                  IGNIS <span className="text-amber-400 font-sans font-semibold text-xs px-2 py-0.5 rounded-full bg-amber-400/10 border border-amber-400/30">HARMONIZE</span>
                </h1>
                <p className="text-xs text-slate-400">
                  {selectedCoords ? `Selected Area: ${selectedCoords.lat}°N, ${selectedCoords.lon}°E` : 'Global Active Hotspots • Click any area on the map to inspect'}
                </p>
              </div>
            </div>

            <div className="flex items-center space-x-3 text-xs">
              <button
                onClick={() => setShowModal(true)}
                className="px-3 py-1.5 rounded-lg bg-space-800 hover:bg-space-700 text-slate-300 hover:text-white border border-space-700 transition"
              >
                APIs & Methodology
              </button>

              {selectedCoords && (
                <button
                  onClick={handleExport}
                  className="flex items-center space-x-2 px-3.5 py-1.5 rounded-lg bg-amber-600 hover:bg-amber-500 text-white font-medium shadow transition"
                >
                  <span>Export 2000–2027 CSV</span>
                </button>
              )}
            </div>
          </header>

          {/* MAIN WORKSPACE: MAP FIRST */}
          <main className="flex-1 p-3 md:p-5 max-w-[1900px] w-full mx-auto flex flex-col lg:flex-row gap-5">
            {/* MAP VIEW CONTAINER */}
            <div className={`transition-all duration-300 flex flex-col ${selectedCoords ? 'lg:w-3/5' : 'w-full'}`}>
              <div className="relative w-full h-[640px] flex flex-col bg-space-900 rounded-2xl border border-space-700/80 shadow-2xl overflow-hidden select-none">
                {/* Map Control Toolbar */}
                <div className="absolute top-4 left-4 right-4 z-20 flex flex-wrap items-center justify-between gap-3 pointer-events-none">
                  {/* Environmental Layer Switcher */}
                  <div className="flex rounded-xl bg-space-900/90 p-1 border border-space-700 shadow-xl backdrop-blur-md pointer-events-auto text-xs">
                    <button
                      onClick={() => setActiveLayer('terrain')}
                      className={`px-3 py-1.5 rounded-lg font-medium transition ${activeLayer === 'terrain' ? 'bg-amber-600 text-white shadow' : 'text-slate-300 hover:text-white'}`}
                      title="Copernicus DEM 30m Global Topography (cop-dem-glo-30)"
                    >
                      🏔️ Terrain (Copernicus)
                    </button>
                    <button
                      onClick={() => setActiveLayer('vegetation')}
                      className={`px-3 py-1.5 rounded-lg font-medium transition ${activeLayer === 'vegetation' ? 'bg-emerald-600 text-white shadow' : 'text-slate-300 hover:text-white'}`}
                      title="ESA Land Cover / WorldCover"
                    >
                      🌿 Vegetation (ESA)
                    </button>
                    <button
                      onClick={() => setActiveLayer('wind')}
                      className={`px-3 py-1.5 rounded-lg font-medium transition ${activeLayer === 'wind' ? 'bg-sky-600 text-white shadow' : 'text-slate-300 hover:text-white'}`}
                      title="Meteomatics Weather API Wind Vectors"
                    >
                      💨 Wind (Meteomatics)
                    </button>
                    <button
                      onClick={() => setActiveLayer('drought')}
                      className={`px-3 py-1.5 rounded-lg font-medium transition ${activeLayer === 'drought' ? 'bg-rose-600 text-white shadow' : 'text-slate-300 hover:text-white'}`}
                      title="TerraClimate Soil Moisture & Drought Aridity"
                    >
                      💧 Drought (TerraClimate)
                    </button>
                    <button
                      onClick={() => setActiveLayer('satellite')}
                      className={`px-3 py-1.5 rounded-lg font-medium transition ${activeLayer === 'satellite' ? 'bg-space-700 text-white shadow' : 'text-slate-400 hover:text-white'}`}
                      title="NASA GIBS Corrected Reflectance True Color"
                    >
                      🛰️ Satellite (GIBS)
                    </button>
                  </div>

                  {/* Live NASA FIRMS Toggle */}
                  <div className="pointer-events-auto">
                    <button
                      onClick={() => setLiveFirmsActive(!liveFirmsActive)}
                      className={`px-3.5 py-1.5 rounded-xl border text-xs font-semibold shadow-lg backdrop-blur-md transition ${
                        liveFirmsActive ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40' : 'bg-space-900/90 text-slate-300 border-space-700 hover:text-white'
                      }`}
                    >
                      <span className={`w-2 h-2 rounded-full inline-block mr-1.5 ${liveFirmsActive ? 'bg-emerald-400 animate-pulse' : 'bg-slate-500'}`} />
                      {liveFirmsActive ? 'NASA FIRMS Live Feed (ON)' : 'Pull Live NASA FIRMS'}
                    </button>
                  </div>
                </div>

                {/* Map Surface */}
                <div
                  onClick={handleMapClick}
                  className={`relative flex-1 w-full h-full cursor-crosshair overflow-hidden transition-colors duration-500 ${
                    activeLayer === 'terrain' ? 'bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-amber-950/40 via-space-950 to-space-950' :
                    activeLayer === 'vegetation' ? 'bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-emerald-950/40 via-space-950 to-space-950' :
                    activeLayer === 'wind' ? 'bg-[radial-gradient(ellipse_at_bottom,_var(--tw-gradient-stops))] from-sky-950/40 via-space-950 to-space-950' :
                    activeLayer === 'drought' ? 'bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-rose-950/40 via-space-950 to-space-950' : 'bg-space-950'
                  }`}
                >
                  <div className="absolute inset-0 bg-[radial-gradient(#334155_1px,transparent_1px)] [background-size:32px_32px] opacity-25 pointer-events-none" />

                  {/* Wind Canvas */}
                  {activeLayer === 'wind' && (
                    <canvas ref={canvasRef} width={800} height={500} className="absolute inset-0 w-full h-full pointer-events-none opacity-80" />
                  )}

                  {/* Continents Outline */}
                  <svg viewBox="-180 -90 360 180" className="absolute inset-0 w-full h-full opacity-20 pointer-events-none" preserveAspectRatio="none">
                    <path d="M -160 65 L -60 65 L -75 25 L -100 20 L -120 40 Z" fill="#475569" />
                    <path d="M -80 10 L -35 -5 L -50 -55 L -75 -45 Z" fill="#475569" />
                    <path d="M -10 65 L 170 65 L 140 30 L 60 30 L 30 40 L 0 50 Z" fill="#475569" />
                    <path d="M -15 35 L 50 30 L 40 -35 L 15 -35 Z" fill="#475569" />
                    <path d="M 115 -15 L 150 -15 L 145 -40 L 120 -35 Z" fill="#475569" />
                  </svg>

                  {/* MODIS & VIIRS Hotspots */}
                  <div className="absolute inset-0 pointer-events-none">
                    {globalHotspots.map(h => {
                      const x = ((h.lon - (-130)) / (155 - (-130))) * 100;
                      const y = (1 - (h.lat - (-40)) / (65 - (-40))) * 100;
                      if (x < 0 || x > 100 || y < 0 || y > 100) return null;
                      const isViirs = h.instrument === 'VIIRS';

                      return (
                        <div
                          key={h.id}
                          onClick={(e) => {
                            e.stopPropagation();
                            setSelectedCoords({ lat: h.lat, lon: h.lon });
                          }}
                          style={{ left: `${x}%`, top: `${y}%` }}
                          className="absolute transform -translate-x-1/2 -translate-y-1/2 pointer-events-auto cursor-pointer group"
                        >
                          <div className={`w-3.5 h-3.5 rounded-full transition-transform group-hover:scale-150 ${isViirs ? 'bg-rose-500/60 shadow-rose-500/50' : 'bg-amber-400/60 shadow-amber-400/50'} shadow-md`} />
                          <div className={`absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 rounded-full border ${isViirs ? 'w-2 h-2 bg-rose-500 border-white' : 'w-2.5 h-2.5 bg-amber-400 border-space-950'}`} />
                        </div>
                      );
                    })}
                  </div>

                  {/* Target Reticle When Area Is Selected */}
                  {selectedCoords && (
                    <div
                      style={{
                        left: `${((selectedCoords.lon - (-130)) / (155 - (-130))) * 100}%`,
                        top: `${(1 - (selectedCoords.lat - (-40)) / (65 - (-40))) * 100}%`
                      }}
                      className="absolute transform -translate-x-1/2 -translate-y-1/2 pointer-events-none z-30"
                    >
                      <div className="w-12 h-12 rounded-full border-2 border-amber-400/80 animate-ping absolute -top-6 -left-6" />
                      <div className="w-8 h-8 rounded-full border-2 border-amber-400 bg-amber-400/20 backdrop-blur-sm flex items-center justify-center -top-4 -left-4 text-amber-300 font-bold">
                        ⌖
                      </div>
                      <div className="absolute top-5 left-1/2 -translate-x-1/2 bg-space-900/95 border border-amber-400/50 px-2 py-0.5 rounded text-[10px] font-mono font-bold text-amber-300 whitespace-nowrap shadow-lg">
                        {selectedCoords.lat}°N, {selectedCoords.lon}°E
                      </div>
                    </div>
                  )}

                  {/* Clean Map Prompt */}
                  {!selectedCoords && (
                    <div className="absolute bottom-6 left-1/2 -translate-x-1/2 bg-space-900/90 border border-space-700/80 px-4 py-2 rounded-xl text-xs text-slate-300 shadow-2xl backdrop-blur-md flex items-center space-x-2 pointer-events-none animate-bounce">
                      <span>⌖ Click anywhere on the map to inspect its multi-decadal calendar & 2027 fire forecast</span>
                    </div>
                  )}

                  <div className="absolute bottom-4 left-4 bg-space-900/80 border border-space-800 px-3 py-1 rounded-lg text-[10px] font-mono text-slate-400 pointer-events-none backdrop-blur-sm">
                    Background: <span className="text-white capitalize font-semibold">{activeLayer}</span> (Planetary Computer & Meteomatics)
                  </div>
                </div>
              </div>
            </div>

            {/* AREA ANALYSIS PANEL (Appears ONLY when area is selected!) */}
            {selectedCoords && environmentalData && (
              <div className="lg:w-2/5 flex flex-col bg-space-900 rounded-2xl border border-space-700/80 p-5 shadow-2xl max-h-[85vh] overflow-y-auto gap-4">
                {/* Panel Header */}
                <div className="flex items-start justify-between border-b border-space-800 pb-3">
                  <div>
                    <div className="flex items-center space-x-2">
                      <h2 className="text-base font-bold text-white tracking-wide">
                        Selected Area Analysis
                      </h2>
                      <span className="text-xs font-mono text-amber-400 bg-amber-400/10 px-2 py-0.5 rounded border border-amber-400/30">
                        {selectedCoords.lat}°N, {selectedCoords.lon}°E
                      </span>
                    </div>
                    <p className="text-xs text-slate-400">
                      Harmonized multi-decadal fire history & 2027 forecast.
                    </p>
                  </div>
                  <button
                    onClick={() => setSelectedCoords(null)}
                    className="p-1.5 rounded-lg bg-space-800 text-slate-400 hover:text-white hover:bg-space-700 transition text-sm font-bold"
                    title="Clear Selection & Return to Full Map"
                  >
                    ✕
                  </button>
                </div>

                {/* 4 Environmental Gauges */}
                <div className="grid grid-cols-2 gap-2 text-xs">
                  <div className="bg-space-850 border border-space-700/70 p-2.5 rounded-xl flex items-center space-x-2">
                    <span className="text-lg">💨</span>
                    <div>
                      <div className="text-[10px] text-slate-400 uppercase font-semibold">Wind (Meteomatics)</div>
                      <div className="font-bold text-white font-mono">{environmentalData.weather.windSpeed} m/s ({environmentalData.weather.windDirection}°)</div>
                    </div>
                  </div>

                  <div className="bg-space-850 border border-space-700/70 p-2.5 rounded-xl flex items-center space-x-2">
                    <span className="text-lg">🌿</span>
                    <div>
                      <div className="text-[10px] text-slate-400 uppercase font-semibold">Fuel (ESA LC)</div>
                      <div className="font-bold text-emerald-300 truncate">{environmentalData.vegetation.fuelLoad}</div>
                    </div>
                  </div>

                  <div className="bg-space-850 border border-space-700/70 p-2.5 rounded-xl flex items-center space-x-2">
                    <span className="text-lg">🏔️</span>
                    <div>
                      <div className="text-[10px] text-slate-400 uppercase font-semibold">Terrain (Copernicus)</div>
                      <div className="font-bold text-white font-mono">{environmentalData.terrain.elevationMeters}m ({environmentalData.terrain.slopeCategory})</div>
                    </div>
                  </div>

                  <div className="bg-space-850 border border-space-700/70 p-2.5 rounded-xl flex items-center space-x-2">
                    <span className="text-lg">💧</span>
                    <div>
                      <div className="text-[10px] text-slate-400 uppercase font-semibold">Aridity (TerraClimate)</div>
                      <div className="font-bold text-rose-300 font-mono">PDSI {environmentalData.climate.pdsi} ({environmentalData.climate.soilMoisturePct}% Soil Moist)</div>
                    </div>
                  </div>
                </div>

                {/* 2027 PREDICTIVE FIRE FORECAST CARD */}
                {prediction2027 && (
                  <div className="bg-gradient-to-r from-space-850 via-space-800 to-space-850 border border-amber-500/30 rounded-xl p-3.5 shadow-lg flex flex-col gap-2">
                    <div className="flex items-center justify-between">
                      <div className="flex items-center space-x-2">
                        <span className="text-amber-400">🔮</span>
                        <h3 className="text-sm font-bold text-white">2027 Fire Season Predictive Forecast</h3>
                      </div>
                      <span className="px-2 py-0.5 rounded-full text-xs font-bold uppercase bg-fuchsia-500/20 text-fuchsia-300 border border-fuchsia-500/40">
                        {prediction2027.summary.riskCategory} Risk
                      </span>
                    </div>

                    <div className="grid grid-cols-3 gap-2 text-center text-xs">
                      <div className="bg-space-900/80 p-2 rounded-lg border border-space-700/60">
                        <div className="text-[10px] text-slate-400 uppercase">Season Onset</div>
                        <div className="font-bold text-amber-300 font-mono text-sm">Week {prediction2027.summary.projectedOnsetWeek}</div>
                      </div>
                      <div className="bg-space-900/80 p-2 rounded-lg border border-space-700/60">
                        <div className="text-[10px] text-slate-400 uppercase">Projected Peak</div>
                        <div className="font-bold text-rose-400 font-mono text-sm">Week {prediction2027.summary.projectedPeakWeek}</div>
                      </div>
                      <div className="bg-space-900/80 p-2 rounded-lg border border-space-700/60">
                        <div className="text-[10px] text-slate-400 uppercase">Expected Fire Load</div>
                        <div className="font-bold text-white font-mono text-sm">{prediction2027.summary.totalAnnualHotspots.toLocaleString()}</div>
                      </div>
                    </div>
                  </div>
                )}

                {/* BURNING ACTIVITY CALENDAR (2000–2027) */}
                <div className="flex flex-col gap-2">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-bold text-white uppercase tracking-wider">
                      Burning Activity Calendar (2000–2027)
                    </span>
                    <div className="flex rounded-lg bg-space-800 p-0.5 border border-space-700 text-[10px]">
                      <button
                        onClick={() => setCalendarMode('harmonized')}
                        className={`px-2 py-0.5 rounded font-medium transition ${calendarMode === 'harmonized' ? 'bg-amber-500 text-white' : 'text-slate-400'}`}
                      >
                        Harmonized
                      </button>
                      <button
                        onClick={() => setCalendarMode('anomaly')}
                        className={`px-2 py-0.5 rounded font-medium transition ${calendarMode === 'anomaly' ? 'bg-fuchsia-600 text-white' : 'text-slate-400'}`}
                      >
                        Z-Score Anomaly
                      </button>
                    </div>
                  </div>

                  {/* Scrollable Matrix */}
                  <div className="overflow-x-auto pb-2 select-none">
                    <div className="min-w-[640px]">
                      {/* Months */}
                      <div className="flex items-center mb-1 text-[10px] font-mono text-slate-400 pl-16">
                        {months.map(m => (
                          <div key={m} style={{ width: '45px' }} className="text-left font-medium">
                            {m}
                          </div>
                        ))}
                      </div>

                      {/* 27 Year Rows */}
                      <div className="space-y-[2px]">
                        {years.map(yr => {
                          const weeks = calendarMatrix.get(yr) || [];
                          const isSel = yr === selectedYear;
                          const is2027 = yr === 2027;

                          return (
                            <div
                              key={yr}
                              className={`flex items-center py-0.5 px-1 rounded transition ${
                                is2027 ? 'bg-indigo-950/40 border border-indigo-500/40' :
                                isSel ? 'bg-amber-400/15 ring-1 ring-amber-400/30' : 'hover:bg-space-800/50'
                              }`}
                            >
                              <button
                                onClick={() => setSelectedYear(yr)}
                                className={`w-14 text-left font-mono text-xs font-semibold ${
                                  is2027 ? 'text-fuchsia-400 font-bold' :
                                  isSel ? 'text-amber-400 font-bold' : 'text-slate-400 hover:text-slate-200'
                                }`}
                              >
                                {is2027 ? '2027 🔮' : yr}
                              </button>

                              <div className="flex items-center space-x-[2px] flex-1">
                                {weeks.map(c => (
                                  <div
                                    key={c.week}
                                    onMouseEnter={() => setHoveredCell(c)}
                                    onMouseLeave={() => setHoveredCell(null)}
                                    onClick={() => setSelectedYear(yr)}
                                    className={`w-[10px] h-[10px] rounded-[1.5px] border cursor-pointer transition-transform hover:scale-125 hover:z-20 ${getCellColor(c)}`}
                                  />
                                ))}
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  </div>

                  {/* Hover detail */}
                  <div className="min-h-[32px] text-[11px] text-slate-300 border-t border-space-800 pt-2">
                    {hoveredCell ? (
                      <div className="flex items-center gap-3">
                        <span><strong>{hoveredCell.year}-W{hoveredCell.week}</strong> {hoveredCell.isPredicted ? '(2027 Predicted)' : ''}</span>
                        <span>Hotspots: <strong className="text-amber-400">{hoveredCell.count}</strong></span>
                        <span>FRP: <strong className="text-rose-400">{hoveredCell.frp} MW</strong></span>
                        <span>Anomaly: <strong className="text-fuchsia-400">+{hoveredCell.avgZ}σ</strong></span>
                      </div>
                    ) : (
                      <span className="text-slate-500 italic">Hover cells to inspect historical breakdown or 2027 predicted values.</span>
                    )}
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* METHODOLOGY MODAL */}
          {showModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-space-900 border border-space-700 max-w-2xl w-full rounded-2xl p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto text-xs text-slate-300 space-y-4">
                <button onClick={() => setShowModal(false)} className="absolute top-4 right-4 text-slate-400 hover:text-white p-1 text-sm font-bold">
                  ✕
                </button>
                <h3 className="text-lg font-bold text-white flex items-center gap-2">
                  <span>📖</span> Harmonization & Environmental Modeling Guide
                </h3>
                <div className="p-3 bg-space-850 rounded-lg border border-space-700 space-y-2">
                  <h4 className="font-bold text-amber-400">🛰️ Multi-Source Architecture</h4>
                  <ul className="list-disc pl-4 space-y-1">
                    <li><strong>NASA FIRMS:</strong> MODIS (1 km, 2000-now) & VIIRS (375 m, 2012-now) thermal anomalies.</li>
                    <li><strong>Meteomatics Weather API:</strong> Atmospheric wind speed & direction vector modeling.</li>
                    <li><strong>Microsoft Planetary Computer (cop-dem-glo-30):</strong> 30m Copernicus Global Digital Elevation Model.</li>
                    <li><strong>ESA CCI Land Cover / WorldCover:</strong> Global vegetation classification & fuel load indexing.</li>
                    <li><strong>TerraClimate:</strong> Monthly climatic water balance, Palmer Drought Severity Index (PDSI), and soil moisture.</li>
                  </ul>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
